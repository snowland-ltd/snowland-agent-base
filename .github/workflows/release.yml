name: Release

# 在 GitHub 仓库的 Releases 页面点击 "Publish release" 后自动构建并发布到 PyPI。
on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # PyPI Trusted Publishing (推荐, 免 Secret):
    # 前往 https://pypi.org/manage/project/snowland-agent-base/settings/
    # 在 "Publishing" 中添加 GitHub 可信发布者, 填写本仓库所有者/名称、
    # 工作流文件名 release.yml, 环境留空即可。
    # 若改用 Token: 删除下方 permissions, 并在 pypa/gh-action-pypi-publish 步骤加
    #   password: ${{ secrets.PYPI_API_TOKEN }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist & wheel
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
